[package]
name = "leafview"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal, responsive PDF viewer for terminals and tmux"
readme = "README.md"

[features]
default = []
typst = ["dep:typst", "dep:typst-layout", "dep:typst-pdf", "dep:typst-kit"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = { version = "0.45", default-features = false }
lru = "0.12"
notify = "8"
ratatui = "0.30"
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
signal-hook = "0.3"
tempfile = "3"
typst = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
typst-kit = { version = "=0.15.1", optional = true, features = ["embedded-fonts", "system-files", "scan-fonts", "system-downloader", "datetime"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
