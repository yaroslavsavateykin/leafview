name: Rust
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: ["", "typst"]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --features '${{ matrix.features }}'
      - run: cargo test --locked --features '${{ matrix.features }}'
      - run: cargo clippy --locked --features '${{ matrix.features }}' --all-targets -- -D warnings
      - run: cargo build --locked --release --features '${{ matrix.features }}'
      - run: python3 scripts/pty-smoke.py
